name: Verify content

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved source
        run: node tools/verify-source.mjs
      - name: Verify additional-language validation
        run: node --test tools/content-source.test.mjs
